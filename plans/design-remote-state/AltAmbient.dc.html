<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #b06cf5; } a:hover { color: #c48ff8; }
    @keyframes glow { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } }
  </style>
</helmet>

<div style="position: relative; width: 900px; height: 620px; overflow: hidden; background: #f4f2ee; font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;">

  <!-- page, untouched -->
  <div style="position: absolute; inset: 0; color: #1a1a1f;">
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 18px; background: #e6e3dd; border-bottom: 1px solid #d4d0c8;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #6f6a60;">dauthau.asia/thongbao/moithau/goi-so-03</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 20px; padding: 34px 38px;">
      <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; max-width: 24ch;">Gói số 03 — Thi công xây dựng công trình</h1>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;">
        <div style="display: flex; flex-direction: column; gap: 5px; padding: 14px 16px; border: 1px solid #ddd9d1; border-radius: 10px; background: #fbfaf8;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .1em; color: #a09a8e;">ĐÓNG THẦU</span><span style="font-size: 13.5px; font-weight: 600;">09:00 · 16/09</span></div>
        <div style="display: flex; flex-direction: column; gap: 5px; padding: 14px 16px; border: 1px solid #ddd9d1; border-radius: 10px; background: #fbfaf8;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .1em; color: #a09a8e;">TỈNH</span><span style="font-size: 13.5px; font-weight: 600;">Thái Nguyên</span></div>
        <div style="display: flex; flex-direction: column; gap: 5px; padding: 14px 16px; border: 1px solid #ddd9d1; border-radius: 10px; background: #fbfaf8;"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .1em; color: #a09a8e;">HÌNH THỨC</span><span style="font-size: 13.5px; font-weight: 600;">Qua mạng</span></div>
      </div>
      <div style="position: relative; align-self: flex-start; margin-top: 4px;">
        <button style="height: 42px; padding: 0 20px; border: 0; border-radius: 10px; background: #1a1a1f; color: #f4f2ee; font-family: inherit; font-size: 14px; font-weight: 600;">Tải về nhanh</button>
      </div>
    </div>
  </div>

  <!-- the whole intervention: a tinted vignette, nothing more -->
  <div class="anim" style="position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px 24px color-mix(in oklch, oklch(0.74 0.19 300) 26%, transparent); animation: glow 3.4s ease-in-out infinite;"></div>

  <!-- cursor, unlabelled — the tint already said who -->
  <div style="position: absolute; left: 156px; top: 402px; pointer-events: none; filter: drop-shadow(0 2px 6px rgba(26,26,31,.28));">
    <svg width="24" height="24" viewBox="0 0 26 26" fill="none"><path d="M4 3.2 20.4 12.1 13.2 13.6 10.4 20.6z" fill="oklch(0.74 0.19 300)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>

  <!-- one small anchored chip -->
  <div style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 6px 0 14px; border-radius: 999px; background: #fff; border: 1px solid #e2ddd4; box-shadow: 0 6px 20px rgba(26,26,31,.1);">
    <span class="anim" style="width: 7px; height: 7px; border-radius: 50%; background: oklch(0.74 0.19 300); animation: glow 1.8s ease-in-out infinite;"></span>
    <span style="font-size: 13px; color: #4a463f;">Browzy đang dùng trang này</span>
    <button style="height: 26px; padding: 0 12px; border: 0; border-radius: 999px; background: #f0ece5; color: #1a1a1f; font-family: inherit; font-size: 12.5px; font-weight: 600;">Dừng</button>
  </div>

</div>
</x-dc>
</body>
</html>
